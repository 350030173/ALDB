<!DOCTYPE html>
<html>
<head>
    <title>Logcat Viewer</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1e1e1e; color: #d4d4d4;
            font-family: 'Consolas','Monaco',monospace; font-size: 13px;
            height: 100vh; display: flex; flex-direction: column;
        }
        #toolbar {
            background: #252526; border-bottom: 1px solid #3e3e42;
            padding: 6px 15px; display: flex; gap: 10px; align-items: center;
            flex-wrap: wrap; z-index: 100;
        }
        #toolbar button {
            padding: 4px 12px; cursor: pointer; background: #0e639c;
            color: white; border: none; border-radius: 3px; font-size: 12px;
            transition: background 0.2s; white-space: nowrap;
        }
        #toolbar button:hover { background: #1177bb; }
        #toolbar button.danger { background: #c75450; }
        #toolbar button.danger:hover { background: #d46966; }
        #toolbar button.secondary { background: #3c3c3c; }
        #toolbar button.secondary:hover { background: #4c4c4c; }
        #toolbar button.active { background: #b5cea8; color: #1e1e1e; }
        #toolbar input, #toolbar select {
            padding: 3px 8px; background: #3c3c3c; color: #d4d4d4;
            border: 1px solid #555; border-radius: 3px; font-size: 12px; font-family: monospace;
        }
        #toolbar span.tb-label { color: #858585; font-size: 11px; }
        #logWrap {
            flex: 1; position: relative; overflow: hidden; min-height: 20px;
        }
        #logs {
            width: 100%; height: 100%; padding: 8px 42px 8px 15px;
            overflow-y: auto; white-space: pre-wrap; word-break: break-all;
            font-size: 12px; line-height: 1.5;
        }
        .log-line { padding: 1px 0; border-bottom: 1px solid #2a2a2a; }
        .error { color: #f48771; }
        .warn { color: #dcdcaa; }
        .info { color: #4fc1ff; }
        .debug { color: #858585; }
        .verbose { color: #6a9955; }
        #scrollToBottom {
            position: absolute; bottom: 12px; right: 12px; z-index: 50;
            background: #0e639c; color: white; padding: 6px 12px;
            border-radius: 50%; cursor: pointer; display: none; font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); border: none;
        }
        #scrollToBottom.show { display: block; }
        #scrollToBottom:hover { background: #1177bb; }
        #resizeHandle {
            height: 4px; background: #3e3e42; cursor: ns-resize;
            flex-shrink: 0; transition: background 0.15s;
        }
        #resizeHandle:hover { background: #0e639c; }
        #bottomTerminalWrap {
            flex-shrink: 0; height: 180px; min-height: 60px;
            max-height: calc(100vh - 100px); border-top: 1px solid #3e3e42;
            display: flex; flex-direction: column; overflow: hidden;
        }
        #terminalTabBar {
            height: 26px; min-height: 26px; background: #1a1a1a;
            border-bottom: 1px solid #3e3e42; display: flex;
            align-items: stretch; overflow-x: auto; overflow-y: hidden;
        }
        #terminalTabBar::-webkit-scrollbar { height: 0; }
        .tab {
            padding: 3px 8px; font-size: 12px; cursor: pointer; color: #858585;
            border-right: 1px solid #3e3e42; display: flex; align-items: center;
            gap: 4px; white-space: nowrap; user-select: none; flex-shrink: 0;
            background: #252526; min-width: 60px;
        }
        .tab:hover { color: #d4d4d4; }
        .tab.active { color: #d4d4d4; background: #1e1e1e; border-bottom: 2px solid #0e639c; }
        .tab .close {
            font-size: 13px; line-height: 1; padding: 0 2px; border-radius: 3px;
            opacity: 0; transition: opacity 0.15s;
        }
        .tab:hover .close { opacity: 1; }
        .tab .close:hover { background: #c75450; color: white; }
        #newTabBtn {
            width: 26px; min-width: 26px; height: 26px; border: none; background: transparent;
            color: #858585; font-size: 16px; cursor: pointer; flex-shrink: 0;
        }
        #newTabBtn:hover { color: #d4d4d4; background: #3c3c3c; }
        #terminalTabContent {
            flex: 1; overflow: hidden; position: relative;
        }
        .term-container {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        }
        .term-container:not(.active) { display: none; }
        #terminalPanel, #terminalHeader, #terminalContainer, #cmdPanel, #mainContainer, #logcatPanel, #bottomTerminal { display: none; }
        .xterm { height: 100%; }
        .xterm .xterm-viewport { background-color: #1e1e1e !important; }
        #toast {
            position: fixed; bottom: 20px; right: 20px; z-index: 200;
            background: #252526; color: #d4d4d4; padding: 10px 20px;
            border-radius: 4px; border: 1px solid #3e3e42;
            opacity: 0; transition: opacity 0.3s;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
<div id="toolbar">
    <button onclick="clearLogs()" data-i18n="clearLogs">🗑️ 清空日志</button>
    <button class="danger" onclick="clearPhoneBuffer()" data-i18n="clearBuf">📱 清缓冲区</button>
    <button onclick="togglePause()" id="pauseBtn" class="secondary" data-i18n="pause">⏸️ 暂停</button>
    <button onclick="toggleAutoScroll()" id="autoScrollBtn" class="active" data-i18n="autoFollow">📜 自动跟随</button>
    <button onclick="toggleLogSave()" id="logSaveBtn" class="secondary" data-i18n="logSaveOff">💾 日志保存: 关</button>

    <input type="text" id="pkgFilter" data-i18n-placeholder="pkgPH" oninput="applyFilters();scheduleSave()" style="width:150px;">
    <input type="text" id="tagFilter" data-i18n-placeholder="tagPH" oninput="applyFilters();scheduleSave()" style="width:150px;">
    <input type="text" id="textFilter" data-i18n-placeholder="textPH" oninput="applyFilters();scheduleSave()" style="width:150px;">

    <select id="filterLevel" onchange="applyFilters();saveAllSettings()">
        <option value="V">Verbose</option><option value="D">Debug</option>
        <option value="I">Info</option><option value="W">Warn</option><option value="E">Error</option>
    </select>
    <select id="maxLogs" onchange="updateMaxLogs()">
        <option value="200">200</option><option value="500" selected>500</option>
        <option value="1000">1000</option><option value="2000">2000</option>
        <option value="5000">5000</option><option value="10000">10000</option>
        <option value="20000">20000</option><option value="50000">50000</option>
    </select>

    <span class="tb-label" data-i18n="logFont">日志</span>
    <select id="logFontSize" onchange="setLogFontSize(this.value)" style="width:52px;padding:2px 4px;"></select>
    <span class="tb-label" data-i18n="termFont">终端</span>
    <select id="termFontSize" onchange="setTermFontSize(this.value)" style="width:52px;padding:2px 4px;"></select>

    <span style="flex:1;"></span>

    <select id="langSelect" onchange="switchLang(this.value)" style="width:60px;padding:2px 4px;">
        <option value="zh">中文</option>
        <option value="en">EN</option>
    </select>

    <span id="connStatus" style="color:#858585;font-size:12px;" data-i18n-html="connOff">⚪ 未连接</span>
    <span id="count">0</span>
</div>

<div id="logWrap">
    <div id="logs"></div>
    <button id="scrollToBottom" onclick="scrollToBottom()" title="">↓</button>
</div>

<div id="resizeHandle" title=""></div>

<div id="bottomTerminalWrap">
    <div id="terminalTabBar">
        <button id="newTabBtn" title="新建终端">+</button>
    </div>
    <div id="terminalTabContent"></div>
</div>

<div id="toast"></div>

<script>
// ===================== 国际化 =====================
const I18N = {
    zh: {
        clearLogs: '🗑️ 清空日志', clearBuf: '📱 清缓冲区', pause: '⏸️ 暂停', resume: '▶️ 继续',
        autoFollow: '📜 自动跟随', manualScroll: '📜 手动滚动',
        pkgPH: '包名 (如: com.example)', tagPH: 'Tag (如: ActivityManager)', textPH: '任意文本搜索...',
        logFont: '日志', termFont: '终端',
        connOn: '🟢 已连接', connOff: '⚪ 未连接', connDisc: '🔴 已断开',
        toastConnected: '✅ Logcat 已连接', toastDisconnected: '🔌 Logcat 已断开，自动重连中...',
        toastCleared: '🗑️ 日志已清空', toastBufCleared: '✅ 手机日志缓冲区已清除',
        toastBufFail: '❌ 清除失败: ', toastBufNoSrv: '❌ 无法连接服务器 (localhost:8766)',
        toastAutoOn: '📜 自动跟随已开启', toastAutoOff: '📜 自动跟随已关闭',
        toastMaxLines: '📦 最大保留: ', toastLines: '条', countFmt: '{total} 条 (显示 {visible} 条)',
        resizeHandle: '拖拽调整终端高度', scrollBtn: '滚动到底部',
        logSaveOn: '💾 日志保存: 开', logSaveOff: '💾 日志保存: 关',
        title: 'Logcat查看器', toastUnknown: '未知错误',
    },
    en: {
        clearLogs: '🗑️ Clear', clearBuf: '📱 Clear Buffer', pause: '⏸️ Pause', resume: '▶️ Resume',
        autoFollow: '📜 Auto Scroll', manualScroll: '📜 Manual',
        pkgPH: 'Package (e.g. com.example)', tagPH: 'Tag (e.g. ActivityManager)', textPH: 'Search text...',
        logFont: 'Log', termFont: 'Term',
        connOn: '🟢 Connected', connOff: '⚪ Offline', connDisc: '🔴 Disconnected',
        toastConnected: '✅ Logcat connected', toastDisconnected: '🔌 Disconnected, reconnecting...',
        toastCleared: '🗑️ Cleared', toastBufCleared: '✅ Buffer cleared',
        toastBufFail: '❌ Clear failed: ', toastBufNoSrv: '❌ Cannot reach server (localhost:8766)',
        toastAutoOn: '📜 Auto-scroll on', toastAutoOff: '📜 Auto-scroll off',
        toastMaxLines: '📦 Max lines: ', toastLines: '', countFmt: '{total} lines ({visible} shown)',
        resizeHandle: 'Drag to resize terminal', scrollBtn: 'Scroll to bottom',
        logSaveOn: '💾 Log Save: ON', logSaveOff: '💾 Log Save: OFF',
        title: 'Logcat Viewer', toastUnknown: 'Unknown error',
    }
};
let L = I18N.zh;

function switchLang(lang) {
    L = I18N[lang] || I18N.zh;
    localStorage.setItem('lang', lang);
    // 更新带 data-i18n 的元素文本
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (L[key]) el.textContent = L[key];
    });
    // 更新 placeholder
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (L[key]) el.placeholder = L[key];
    });
    // 更新 html 注入的
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (L[key]) el.innerHTML = L[key];
    });
    // 更新 title
    document.title = L.title;
    // 更新 resize handle / scroll button title
    document.getElementById('resizeHandle').title = L.resizeHandle;
    document.getElementById('scrollToBottom').title = L.scrollBtn;
    // 更新状态文字
    updateConnStatusUI();
    // 更新暂停按钮
    updatePauseBtnText();
    // 更新自动滚动按钮
    updateAutoScrollBtnText();
    // 更新计数显示
    updateCountDisplay();
    // 更新 maxLogs
    updateMaxLogsLabel();
}

function updatePauseBtnText() {
    document.getElementById('pauseBtn').textContent = paused ? L.resume : L.pause;
}
function updateAutoScrollBtnText() {
    document.getElementById('autoScrollBtn').textContent = autoScroll ? L.autoFollow : L.manualScroll;
}

// ===================== 字体大小（5-25） =====================
function buildFontSizeOptions() {
    ['logFontSize','termFontSize'].forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        for (let i = 5; i <= 25; i++) {
            const o = document.createElement('option');
            o.value = i; o.textContent = i;
            if ((id === 'logFontSize' && i === 12) || (id === 'termFontSize' && i === 13)) o.selected = true;
            sel.appendChild(o);
        }
    });
}
buildFontSizeOptions();

function initFontSizes() {
    const savedLog = localStorage.getItem('logFontSize');
    const savedTerm = localStorage.getItem('termFontSize');
    if (savedLog) {
        document.getElementById('logFontSize').value = savedLog;
        document.getElementById('logs').style.fontSize = savedLog + 'px';
    }
    if (savedTerm) {
        document.getElementById('termFontSize').value = savedTerm;
        tabs.forEach(t => t.term.options.fontSize = parseInt(savedTerm));
    }
}

function setLogFontSize(size) {
    document.getElementById('logs').style.fontSize = size + 'px';
    localStorage.setItem('logFontSize', size);
}

// ===================== 全局设置持久化（保存到项目目录 logcat_settings.json） =====================
const SETTINGS_URL = 'http://localhost:8766/settings';
let _saveTimer = null;

function saveAllSettings() {
    const s = {
        paused, autoScroll, maxLogs, logSaveEnabled,
        pkgFilter: document.getElementById('pkgFilter').value,
        tagFilter: document.getElementById('tagFilter').value,
        textFilter: document.getElementById('textFilter').value,
        filterLevel: document.getElementById('filterLevel').value,
        termHeight: document.getElementById('bottomTerminalWrap').style.height,
    };
    // 同时保存到服务器文件 和 localStorage（双保险）
    localStorage.setItem('logcatSettings', JSON.stringify(s));
    fetch(SETTINGS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(s)
    }).catch(() => {}); // 服务器未启动时静默失败，至少 localStorage 还有
}

function applySettings(s) {
    if (typeof s.paused === 'boolean') { paused = s.paused; updatePauseBtnText(); }
    if (typeof s.autoScroll === 'boolean') {
        autoScroll = s.autoScroll;
        if (autoScroll) autoScrollBtn.classList.add('active');
        else autoScrollBtn.classList.remove('active');
        updateAutoScrollBtnText();
    }
    if (s.maxLogs) { maxLogs = parseInt(s.maxLogs); document.getElementById('maxLogs').value = maxLogs; }
    if (s.pkgFilter) document.getElementById('pkgFilter').value = s.pkgFilter;
    if (s.tagFilter) document.getElementById('tagFilter').value = s.tagFilter;
    if (s.textFilter) document.getElementById('textFilter').value = s.textFilter;
    if (s.filterLevel) document.getElementById('filterLevel').value = s.filterLevel;
    if (s.termHeight) document.getElementById('bottomTerminalWrap').style.height = s.termHeight;
    if (typeof s.logSaveEnabled === 'boolean' && s.logSaveEnabled) {
        logSaveEnabled = false; toggleLogSave();  // 初始 false，调用 toggle 变成 true
    }
}

async function loadAllSettings() {
    // 优先从服务器文件加载
    try {
        const resp = await fetch(SETTINGS_URL);
        if (resp.ok) {
            const s = await resp.json();
            if (s && Object.keys(s).length > 0) {
                applySettings(s);
                return;
            }
        }
    } catch(e) {}
    // 服务器不可用时从 localStorage 加载
    try {
        const raw = localStorage.getItem('logcatSettings');
        if (raw) applySettings(JSON.parse(raw));
    } catch(e) {}
}

function scheduleSave() {
    if (_saveTimer) clearTimeout(_saveTimer);
    _saveTimer = setTimeout(saveAllSettings, 500);
}

// ===================== Logcat 功能 =====================
const logs = document.getElementById('logs');
const countEl = document.getElementById('count');
const toast = document.getElementById('toast');
const scrollToBottomBtn = document.getElementById('scrollToBottom');
const autoScrollBtn = document.getElementById('autoScrollBtn');
let paused = false, logCount = 0, maxLogs = 500, autoScroll = true, userScrolled = false;
const levelOrder = { 'V':0,'D':1,'I':2,'W':3,'E':4,'F':5 };

function updateCountDisplay() {
    countEl.textContent = L.countFmt.replace('{total}', logCount).replace('{visible}', logs.children.length);
}
function updateMaxLogsLabel() {}  // no-op for now

// ===================== WebSocket 连接管理 =====================
let ws = null, reconnectTimer = null, reconnectAttempt = 0;
const MAX_RECONNECT_DELAY = 30000;

function connectWebSocket() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    ws = new WebSocket('ws://localhost:8765');
    ws.onopen = () => {
        reconnectAttempt = 0;
        updateConnStatus(true);
        showToast(L.toastConnected);
        applyFilters();
    };
    ws.onmessage = (e) => {
        if (paused) return;
        const text = e.data;
        const filters = getFilters();
        logCount++;
        if (!matchesFilter(text, filters)) { updateCountDisplay(); return; }
        addLogLine(text);
        // 日志保存：只保存界面上实际显示的
        if (logSaveEnabled) { logSaveBuffer.push(text); scheduleLogSaveFlush(); }
        updateCountDisplay();
    };
    ws.onerror = () => {};
    ws.onclose = () => {
        updateConnStatus(false);
        showToast(L.toastDisconnected);
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempt), MAX_RECONNECT_DELAY);
        reconnectAttempt++;
        reconnectTimer = setTimeout(connectWebSocket, delay);
    };
}
connectWebSocket();

function updateConnStatus(connected) {
    const el = document.getElementById('connStatus');
    if (!el) return;
    if (connected) {
        el.innerHTML = L.connOn; el.style.color = '#4ec94e';
        el.setAttribute('data-i18n-html', 'connOn');
    } else {
        el.innerHTML = L.connDisc; el.style.color = '#f48771';
        el.setAttribute('data-i18n-html', 'connDisc');
    }
}
function updateConnStatusUI() {
    const el = document.getElementById('connStatus');
    if (!el) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
        el.innerHTML = L.connOn; el.style.color = '#4ec94e';
    } else {
        el.innerHTML = L.connDisc; el.style.color = '#f48771';
    }
}

logs.addEventListener('scroll', () => {
    const atBottom = logs.scrollHeight - logs.scrollTop - logs.clientHeight < 30;
    if (atBottom) { userScrolled = false; scrollToBottomBtn.classList.remove('show'); }
    else { userScrolled = true; if (autoScroll) scrollToBottomBtn.classList.add('show'); }
});

// ===================== 日志解析 =====================
function parseLogLine(text) {
    const r = { raw: text, time: '', pid: '', tid: '', level: 'V', tag: '', content: text };
    const m1 = text.match(/^(\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(\d+)\s+(\d+)\s+([VDIWEF])\s+([^:]+):\s*(.*)$/);
    if (m1) { r.time=m1[1]; r.pid=m1[2]; r.tid=m1[3]; r.level=m1[4]; r.tag=m1[5].trim(); r.content=m1[6]; return r; }
    const m2 = text.match(/^(\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+([VDIWEF])\/([^(:]+)[(:]?\d*[)]:?\s*(.*)$/);
    if (m2) { r.time=m2[1]; r.level=m2[2]; r.tag=m2[3].trim(); r.content=m2[4]; return r; }
    const m3 = text.match(/^([VDIWEF])\/([^(:]+)[(:]?\d*[)]:?\s*(.*)$/);
    if (m3) { r.level=m3[1]; r.tag=m3[2].trim(); r.content=m3[3]; return r; }
    const m4 = text.match(/^([VDIWEF])\((\d+)\)\s+(.*)$/);
    if (m4) { r.level=m4[1]; r.pid=m4[2]; r.content=m4[3]; return r; }
    const m5 = text.match(/\s([VDIWEF])\//);
    if (m5) r.level = m5[1];
    return r;
}

function getFilters() {
    return {
        pkg: document.getElementById('pkgFilter').value.trim(),
        tag: document.getElementById('tagFilter').value.trim(),
        text: document.getElementById('textFilter').value.trim().toLowerCase(),
        level: document.getElementById('filterLevel').value
    };
}

function matchesFilter(text, filters) {
    const p = parseLogLine(text);
    if (levelOrder[p.level] < levelOrder[filters.level]) return false;
    if (filters.pkg) {
        const pl = filters.pkg.toLowerCase();
        if (!p.content.toLowerCase().includes(pl) && !p.raw.toLowerCase().includes(pl)) return false;
    }
    if (filters.tag) {
        const tl = filters.tag.toLowerCase(), ptl = p.tag.toLowerCase();
        if (ptl !== tl && !ptl.startsWith(tl) && !ptl.includes(tl)) return false;
    }
    if (filters.text && !p.raw.toLowerCase().includes(filters.text)) return false;
    return true;
}

function addLogLine(text, className) {
    const div = document.createElement('div');
    div.className = 'log-line' + (className ? ' ' + className : '');
    div.textContent = text;
    div.dataset.rawText = text;
    if (!className) {
        const lv = parseLogLine(text).level;
        if (lv==='E'||lv==='F') div.classList.add('error');
        else if (lv==='W') div.classList.add('warn');
        else if (lv==='I') div.classList.add('info');
        else if (lv==='D') div.classList.add('debug');
        else div.classList.add('verbose');
    }
    logs.appendChild(div);
    while (logs.children.length > maxLogs) logs.removeChild(logs.firstChild);
    if (autoScroll && !userScrolled) logs.scrollTop = logs.scrollHeight;
}

function toggleAutoScroll() {
    autoScroll = !autoScroll; userScrolled = false;
    if (autoScroll) {
        autoScrollBtn.classList.add('active'); scrollToBottomBtn.classList.remove('show');
        logs.scrollTop = logs.scrollHeight; showToast(L.toastAutoOn);
    } else {
        autoScrollBtn.classList.remove('active'); showToast(L.toastAutoOff);
    }
    updateAutoScrollBtnText(); saveAllSettings();
}
function scrollToBottom() { userScrolled = false; scrollToBottomBtn.classList.remove('show'); logs.scrollTop = logs.scrollHeight; }
function clearLogs() { logs.innerHTML = ''; logCount = 0; updateCountDisplay(); showToast(L.toastCleared); }

async function clearPhoneBuffer() {
    try {
        const resp = await fetch('http://localhost:8766/clear', { method: 'POST' });
        const data = await resp.json();
        showToast(data.success ? L.toastBufCleared : L.toastBufFail + (data.error || L.toastUnknown));
    } catch (e) { showToast(L.toastBufNoSrv); }
}

function togglePause() { paused = !paused; updatePauseBtnText(); saveAllSettings(); }

let logSaveEnabled = false;
const logSaveBuffer = [];
let _logFlushTimer = null;

function flushLogSaveBuffer() {
    if (!logSaveBuffer.length) return;
    const batch = logSaveBuffer.splice(0);
    fetch('http://localhost:8766/logcat-write', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: batch.join('\n')
    }).catch(() => {});
}
function scheduleLogSaveFlush() {
    if (_logFlushTimer) return;
    _logFlushTimer = setTimeout(() => { _logFlushTimer = null; flushLogSaveBuffer(); }, 500);
}

function toggleLogSave() {
    logSaveEnabled = !logSaveEnabled;
    const btn = document.getElementById('logSaveBtn');
    btn.textContent = logSaveEnabled ? L.logSaveOn : L.logSaveOff;
    if (logSaveEnabled) { btn.classList.add('active'); } else { btn.classList.remove('active'); flushLogSaveBuffer(); }
    fetch('http://localhost:8766/logcat-toggle?enable=' + (logSaveEnabled ? '1' : '0'))
        .catch(() => {
            logSaveEnabled = !logSaveEnabled;
            btn.textContent = logSaveEnabled ? L.logSaveOn : L.logSaveOff;
            if (logSaveEnabled) btn.classList.add('active'); else btn.classList.remove('active');
            showToast('\u274c 日志保存切换失败');
        });
    saveAllSettings();
}

function applyFilters() {
    const filters = getFilters();
    const children = Array.from(logs.children);
    let visible = 0;
    children.forEach(c => {
        const t = c.dataset.rawText || c.textContent;
        if (matchesFilter(t, filters)) { c.style.display = ''; visible++; }
        else { c.style.display = 'none'; }
    });
    countEl.textContent = L.countFmt.replace('{total}', logCount).replace('{visible}', visible);
}

function updateMaxLogs() {
    maxLogs = parseInt(document.getElementById('maxLogs').value);
    while (logs.children.length > maxLogs) logs.removeChild(logs.firstChild);
    updateCountDisplay(); saveAllSettings();
    showToast(L.toastMaxLines + maxLogs + ' ' + L.toastLines);
}

// ===================== 多 Tab 终端 =====================
const tabs = new Map();    // sessionId → { term, ws, fitAddon, container, el }
let activeTabId = null;
let tabCounter = 0;

function nextTabName() { tabCounter++; return 'Shell ' + tabCounter; }

function createTab(sessionId, cmd) {
    const tc = document.getElementById('terminalTabContent');
    // tab 标签
    const tabEl = document.createElement('span');
    tabEl.className = 'tab active';
    tabEl.innerHTML = '<span class="name">' + nextTabName() + '</span><span class="close">&times;</span>';
    tabEl.querySelector('.name').onclick = () => switchTab(sessionId);
    tabEl.querySelector('.close').onclick = (e) => { e.stopPropagation(); closeTab(sessionId); };
    document.getElementById('newTabBtn').before(tabEl);

    // 终端容器
    const container = document.createElement('div');
    container.className = 'term-container active';
    tc.appendChild(container);

    const savedFont = parseInt(localStorage.getItem('termFontSize')) || 13;
    const t = new Terminal({
        fontFamily: 'Consolas, "Courier New", monospace', fontSize: savedFont,
        theme: { background:'#1e1e1e', foreground:'#d4d4d4', cursor:'#d4d4d4',
            selectionBackground:'#264f78', black:'#1e1e1e', red:'#f48771',
            green:'#b5cea8', yellow:'#dcdcaa', blue:'#4fc1ff',
            magenta:'#c586c0', cyan:'#9cdcfe', white:'#d4d4d4' },
        cursorBlink: true, cursorStyle: 'block', scrollback: 10000, allowTransparency: false
    });
    const fit = new FitAddon.FitAddon();
    t.loadAddon(fit);
    t.open(container);

    const ro = new ResizeObserver(() => { fit.fit(); sendTabResize(sessionId); });
    ro.observe(container);

    // WebSocket
    const ws = new WebSocket('ws://localhost:8765/terminal');
    ws.onopen = () => {
        ws.send(JSON.stringify({ type:'create', session_id:sessionId, cols:t.cols||120, rows:t.rows||30, command:cmd }));
    };
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'output') {
            if (msg.binary) {
                const bin = atob(msg.data); const bytes = new Uint8Array(bin.length);
                for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
                t.write(bytes);
            } else { t.write(msg.data); }
        } else if (msg.type === 'created') { t.focus(); }
        else if (msg.type === 'error') { t.writeln('\x1b[31m\u274c '+msg.data+'\x1b[0m'); }
    };
    ws.onerror = () => t.writeln('\x1b[31m\u274c Terminal error\x1b[0m');
    ws.onclose = () => {};

    t.onData(data => {
        if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ type:'input', session_id:sessionId, data }));
    });

    tabs.set(sessionId, { term:t, ws, fitAddon:fit, container, el:tabEl });
    switchTab(sessionId);
    return sessionId;
}

function switchTab(sessionId) {
    if (activeTabId === sessionId) return;
    // 隐藏旧
    if (activeTabId && tabs.has(activeTabId)) {
        const old = tabs.get(activeTabId);
        old.container.classList.remove('active');
        old.el.classList.remove('active');
    }
    // 显示新
    activeTabId = sessionId;
    const cur = tabs.get(sessionId);
    cur.container.classList.add('active');
    cur.el.classList.add('active');
    cur.fitAddon.fit();
    setTimeout(() => cur.term.focus(), 50);
    updateTabCloseButtons();
}

function closeTab(sessionId) {
    if (tabs.size <= 1) return; // 至少保留 1 个
    const cur = tabs.get(sessionId);
    if (cur.ws && cur.ws.readyState === WebSocket.OPEN)
        cur.ws.send(JSON.stringify({ type:'close', session_id:sessionId }));
    cur.ws.close();
    cur.term.dispose();
    cur.container.remove();
    cur.el.remove();
    tabs.delete(sessionId);
    if (activeTabId === sessionId) {
        const last = [...tabs.keys()].pop();
        switchTab(last);
    }
    updateTabCloseButtons();
}

function updateTabCloseButtons() {
    const onlyOne = tabs.size <= 1;
    tabs.forEach(tab => { tab.el.querySelector('.close').style.display = onlyOne ? 'none' : ''; });
}

function sendTabResize(sessionId) {
    const cur = tabs.get(sessionId);
    if (cur && cur.ws && cur.ws.readyState === WebSocket.OPEN)
        cur.ws.send(JSON.stringify({ type:'resize', session_id:sessionId, cols:cur.term.cols, rows:cur.term.rows }));
}

function setTermFontSize(size) {
    tabs.forEach(t => t.term.options.fontSize = parseInt(size));
    localStorage.setItem('termFontSize', size);
}

// 初始化：创建第一个 tab
createTab('main', null);

// 点击 + 新建 tab
document.getElementById('newTabBtn').addEventListener('click', () => {
    createTab('tab-' + Date.now(), null);
});

// ===================== 拖拽调整终端高度 =====================
(function initResize(){
    const h = document.getElementById('resizeHandle');
    const w = document.getElementById('bottomTerminalWrap');
    let d=false, sY, sH;
    h.addEventListener('mousedown', e => {
        d=true; sY=e.clientY; sH=w.offsetHeight;
        document.body.style.cursor='ns-resize'; document.body.style.userSelect='none'; e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
        if(!d)return;
        let nH = Math.max(60, Math.min(sH + (sY - e.clientY), window.innerHeight - 100));
        w.style.height = nH + 'px';
        const cur = tabs.get(activeTabId);
        if (cur) cur.fitAddon.fit();
        sendTabResize(activeTabId);
    });
    document.addEventListener('mouseup', () => { if(d){ d=false; document.body.style.cursor=''; document.body.style.userSelect=''; saveAllSettings(); } });
})();

// ===================== 初始化 =====================
(function init() {
    // 恢复语言
    const savedLang = localStorage.getItem('lang') || 'zh';
    document.getElementById('langSelect').value = savedLang;
    switchLang(savedLang);
    // 恢复字体
    initFontSizes();
    // 恢复全局设置（暂停、滚动、过滤、终端高度等）
    loadAllSettings();
    // 更新 handle/button title
    document.getElementById('resizeHandle').title = L.resizeHandle;
    document.getElementById('scrollToBottom').title = L.scrollBtn;
    // 初始计数 + 应用过滤器
    updateCountDisplay();
    applyFilters();
})();

function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}
</script>
